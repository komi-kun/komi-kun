name: OpenCode PR Review

# Automatic review on the first non-draft PR event, plus manual re-reviews via
# `/oc review` or `/opencode review` comments. Pushes (`synchronize`) do not
# re-trigger the workflow.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # Reviews are slow and expensive; queue one run and let the job timeout bound
  # it instead of cancelling a review midway.
  cancel-in-progress: false

jobs:
  review:
    name: Review PR
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (startsWith(github.event.comment.body, '/oc review') ||
        startsWith(github.event.comment.body, '/opencode review')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout target branch/PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Reviews run against the initial checkout (default branch or the PR merge
      # ref), not the untrusted head the action switches to afterwards.
      - name: Verify same-repo PR
        id: pr-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)" = "true" ]; then
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping fork PR: OpenCode reviews only same-repo branches."
          else
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          fi

      # The action checks out the PR head, so stage the helper and the config in
      # $RUNNER_TEMP first. Both then come from the trusted initial checkout.
      - name: Stage trusted review tooling
        run: |
          cp .github/scripts/post_opencode_review.py "$RUNNER_TEMP/post_opencode_review.py"
          cp .github/opencode-review.json "$RUNNER_TEMP/opencode-review.json"

      # Automatic review: `prompt` supplies the review instructions because a
      # `pull_request` event has no comment body.
      - name: Run OpenCode PR Review
        if: github.event_name == 'pull_request' && steps.pr-source.outputs.same_repo == 'true'
        uses: anomalyco/opencode/github@5caf1f9f6f5f30e13fc50a788ad953d97ae3748f # github-v1.2.26
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Makes the read-only `opencode-review` agent the server default. The
          # action's `agent` input is not forwarded by every CLI version.
          OPENCODE_CONFIG: ${{ runner.temp }}/opencode-review.json
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: opencode-review
          use_github_token: true
          prompt: |
            You are reviewing code for the Komikku Android application (Kotlin, Jetpack Compose, Coroutines/Flow, Android Architecture Components).

            This is a read-only review. Do not modify repository files. The only file you may write is `build/opencode-review/findings.json`.

            Inspect the changes with `gh pr diff`, or `git diff origin/<base-branch>...HEAD` using the base branch from the appended PR context. A bare `git diff` is empty because the action checks out a clean branch. Only report lines that are part of the diff.

            Review guidelines:
            1. Concurrency: Check for Coroutine leaks, proper Dispatcher usage, race conditions, or unhandled exceptions.
            2. Compose: Ensure state hoisting follows best practices, detect unnecessary recompositions, and verify proper remember/derivedStateOf usage.
            3. Android Resources & Lifecycle: Check lifecycle scopes, memory leaks, and proper cleanup of resources.
            4. Performance & DB: Look for unnecessary queries on the main thread, unindexed searches, or inefficient list processing.
            5. Architecture: Ensure domain logic remains separated from UI components and adheres to existing Tachiyomi/Mihon conventions.
            6. Brevity: Do not explain obvious language features. Provide clear, direct, and actionable findings with file references.

            Output:
            1. Write `build/opencode-review/findings.json` with exactly this shape:
               {"findings":[{"path":"app/src/main/java/.../Foo.kt","line":123,"severity":"high","body":"What is wrong, why it matters, and the concrete fix."}]}
               - `path` is relative to the repository root.
               - `line` is the line number in the new version of the file and must be a line present in the diff.
               - `severity` is one of `low`, `medium`, `high`, `critical`.
               - Omit findings you cannot pin to a changed line.
            2. Reply with one short paragraph summarising the review. Do not repeat every finding, because they are posted as inline comments. If there are no findings, write {"findings":[]} and say so.

      # Manual re-review: no `prompt`, so the action uses the triggering comment
      # body and any extra instructions the commenter added after `/oc review`.
      - name: Run OpenCode PR Review (comment command)
        if: github.event_name == 'issue_comment' && steps.pr-source.outputs.same_repo == 'true'
        uses: anomalyco/opencode/github@5caf1f9f6f5f30e13fc50a788ad953d97ae3748f # github-v1.2.26
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Makes the read-only `opencode-review` agent the server default. The
          # action's `agent` input is not forwarded by every CLI version.
          OPENCODE_CONFIG: ${{ runner.temp }}/opencode-review.json
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: opencode-review
          use_github_token: true
          prompt: |
            You are reviewing code for the Komikku Android application (Kotlin, Jetpack Compose, Coroutines/Flow, Android Architecture Components).

            This is a read-only review. Do not modify repository files. The only file you may write is `build/opencode-review/findings.json`.

            Inspect the changes with `gh pr diff`, or `git diff origin/<base-branch>...HEAD` using the base branch from the appended PR context. A bare `git diff` is empty because the action checks out a clean branch. Only report lines that are part of the diff.

            Review guidelines:
            1. Concurrency: Check for Coroutine leaks, proper Dispatcher usage, race conditions, or unhandled exceptions.
            2. Compose: Ensure state hoisting follows best practices, detect unnecessary recompositions, and verify proper remember/derivedStateOf usage.
            3. Android Resources & Lifecycle: Check lifecycle scopes, memory leaks, and proper cleanup of resources.
            4. Performance & DB: Look for unnecessary queries on the main thread, unindexed searches, or inefficient list processing.
            5. Architecture: Ensure domain logic remains separated from UI components and adheres to existing Tachiyomi/Mihon conventions.
            6. Brevity: Do not explain obvious language features. Provide clear, direct, and actionable findings with file references.

            Additional instructions from the commenter:
            ${{ github.event.comment.body }}

            Output:
            1. Write `build/opencode-review/findings.json` with exactly this shape:
               {"findings":[{"path":"app/src/main/java/.../Foo.kt","line":123,"severity":"high","body":"What is wrong, why it matters, and the concrete fix."}]}
               - `path` is relative to the repository root.
               - `line` is the line number in the new version of the file and must be a line present in the diff.
               - `severity` is one of `low`, `medium`, `high`, `critical`.
               - Omit findings you cannot pin to a changed line.
            2. Reply with one short paragraph summarising the review. Do not repeat every finding, because they are posted as inline comments. If there are no findings, write {"findings":[]} and say so.

      - name: Post inline review comments
        if: always() && steps.pr-source.outputs.same_repo == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/post_opencode_review.py" ]; then
            python3 "$RUNNER_TEMP/post_opencode_review.py"
          else
            echo "Inline-comment helper was not staged; skipping."
          fi

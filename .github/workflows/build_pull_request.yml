name: PR build check
on:
  #  push:
  #    branches:
  #      - develop
  #    paths-ignore:
  #      - '**.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n-kmk/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-kmk/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-kmk/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-kmk/src/commonMain/moko-resources/base/plurals.xml'
      - '!i18n-kun/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-kun/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-kun/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-kun/src/commonMain/moko-resources/base/plurals.xml'
  # Dispatch or Manual triggers
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      # KUN -->
      - name: Provision native toolchain
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865" "cmake;3.22.1"
      # KUN <--

      - name: Check optional secrets
        id: opt_secrets
        run: |
          echo "google_services=${{ secrets.GOOGLE_SERVICES_JSON != '' }}" >> "$GITHUB_OUTPUT"
          echo "client_secrets=${{ secrets.GOOGLE_CLIENT_SECRETS_JSON != '' }}" >> "$GITHUB_OUTPUT"
          echo "signing_key=${{ secrets.SIGNING_KEY != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.GOOGLE_SERVICES_JSON != '' }}" = "true" ]; then
            echo "telemetry_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "telemetry_flag=-Pinclude-telemetry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write google-services.json
        if: github.repository == github.event.pull_request.head.repo.full_name && steps.opt_secrets.outputs.google_services == 'true'
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_JSON }}
          write-mode: overwrite

      - name: Write client_secrets.json
        if: github.repository == github.event.pull_request.head.repo.full_name && steps.opt_secrets.outputs.client_secrets == 'true'
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # KUN -->
      # GPL-free boundary gate (contract §1.3/§1.9). Text-only, needs no NDK/CMake, but the full
      # checkout (submodules: recursive, above) is what makes the §1.3 files present.
      - name: Verify GPL-free boundary
        run: ./gradlew verifyGplFree
      # KUN <--

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        if: github.repository == github.event.pull_request.head.repo.full_name
        run: ./gradlew assembleNightly -Pdist=ci ${{ steps.opt_secrets.outputs.telemetry_flag }}

      - name: Build app
        if: github.repository != github.event.pull_request.head.repo.full_name
        run: ./gradlew assembleNightly

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew :data:verifyDebugDatabaseMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Sign APK
        if: github.repository == github.event.pull_request.head.repo.full_name && steps.opt_secrets.outputs.signing_key == 'true'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/nightly
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Signed File name
        id: signed_filename
        if: github.repository == github.event.pull_request.head.repo.full_name && steps.opt_secrets.outputs.signing_key == 'true'
        run: |
          echo "SIGNED_TRAIL=-signed" >> $GITHUB_OUTPUT

      - name: Rename apk
        id: current_commit
        run: |
          set -e
          echo "The git ref is: ${{ github.ref }}"
          version_tag=p$(echo ${{ github.ref }} | cut -d '/' -f 3)
          commit_count=$(git rev-list --count HEAD)
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          mv app/build/outputs/apk/nightly/app-universal-nightly${{ steps.signed_filename.outputs.SIGNED_TRAIL }}.apk Komikun-$version_tag-r$commit_count.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikun-${{ steps.current_commit.outputs.VERSION_TAG }}-r${{ steps.current_commit.outputs.COMMIT_COUNT }}.apk
          path: ./*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/nightly

  # KUN -->
  # T2 Yomitan engine conformance (plan 05 §A1.5/§A4): executes the committed corpus against the
  # vendored `hoshidicts` engine on a host (desktop) build of `hoshidicts_jni`, so it is
  # device-free and needs no emulator. Separated from `build` so it can be path-filtered and so a
  # slow/absent host toolchain never blocks the APK build.
  conformance-t2:
    name: Yomitan T2 conformance
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      # Only engine, corpus, test-infrastructure or build-logic changes can move the T2 verdicts.
      # Fail open (run the gate) whenever the change list cannot be computed.
      - name: Decide whether T2 must run
        id: t2
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! changed="$(git diff --name-only "$base" "$head" 2>/dev/null)"; then
            git fetch --no-tags origin "$base" "$head" || true
            changed="$(git diff --name-only "$base" "$head" 2>/dev/null || true)"
          fi
          if [[ -z "$changed" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if grep -Eq '^(core/dictionary/|tools/yomitan-corpus/|gradle/|buildSrc/|settings\.gradle\.kts|build\.gradle\.kts|\.github/workflows/build_pull_request\.yml)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.t2.outputs.run == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      # The vendored engine uses `std::views::as_rvalue | std::ranges::to<std::vector>()`; libstdc++
      # only gained `std::ranges::to` in GCC 14 (GCC 14 release notes, libstdc++ section), while the
      # ubuntu-24.04 default is GCC 13. Install a modern GCC and *select* the newest one that
      # actually passes the C++23 probe; `build-host-conformance-lib.sh` probes it again and fails
      # fast with the missing feature if this ever regresses.
      - name: Install and select host C++ toolchain (GCC >= 14)
        if: steps.t2.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          for pkg in g++-14 g++-15 g++-16; do
            if ! sudo apt-get install -y --no-install-recommends "$pkg"; then
              echo "note: $pkg not available on this runner image"
            fi
          done
          cat > /tmp/t2-cxx-probe.cpp <<'SRC'
          #include <ranges>
          #include <utility>
          #include <vector>
          int main() {
            std::vector<int> values;
            auto out = std::move(values) | std::views::as_rvalue | std::ranges::to<std::vector>();
            return static_cast<int>(out.size());
          }
          SRC
          chosen=""
          for candidate in g++-16 g++-15 g++-14 g++; do
            if command -v "$candidate" >/dev/null && "$candidate" -std=c++23 -fsyntax-only /tmp/t2-cxx-probe.cpp >/dev/null 2>&1; then
              chosen="$candidate"
              break
            fi
          done
          if [[ -z "$chosen" ]]; then
            echo "::error::no C++ compiler with std::ranges::to found (GCC >= 14 is required by the vendored hoshidicts engine)"
            exit 1
          fi
          echo "selected $chosen: $("$chosen" --version | head -1)"
          cmake --version | head -1
          echo "CXX=$chosen" >> "$GITHUB_ENV"
          echo "CC=${chosen/g++/gcc}" >> "$GITHUB_ENV"

      - name: Set up gradle
        if: steps.t2.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run T2 engine conformance
        if: steps.t2.outputs.run == 'true'
        run: ./gradlew :core:dictionary:conformanceHostTest

      - name: Upload conformance report
        if: steps.t2.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yomitan-t2-report-${{ github.sha }}
          path: |
            core/dictionary/build/reports/tests/conformanceHostTest
            core/dictionary/build/conformance/host-lib/lib/BUILD_INFO.txt
  # KUN <--

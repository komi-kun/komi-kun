android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
# Gradle isolated projects is intentionally NOT enabled: Gradle is pinned to 9.3.1 (which only
# knows the no-op `org.gradle.isolated-projects` name) and the build is not isolated-projects-clean
# yet — the moko-resources plugin and several scripts perform cross-project property lookups.
# Enabling it (`org.gradle.unsafe.isolated-projects=true`) fails the build. See FORK.md.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

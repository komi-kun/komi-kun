android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
# Gradle isolated projects is intentionally NOT enabled. It needs Gradle >= 9.6 (where implicit
# parent-project property lookups become a deprecation instead of a fatal isolated-projects error),
# but AGP 8.13.2 is incompatible with Gradle >= 9.6, so no version satisfies both. Enable it with the
# coherent AGP 9.4.1 / Gradle 9.8.1 toolchain bump. See FORK.md.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
